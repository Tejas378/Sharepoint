<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Local NVIDIA chat</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <main class="app">
    <header class="app-header">
      <div class="title-block">
        <h1>NVIDIA chat</h1>
        <p class="subtitle">Local only &middot; <span id="model-badge">&hellip;</span></p>
      </div>
      <div class="header-actions">
        <button id="settings-toggle" class="btn" type="button" aria-expanded="false" aria-controls="settings">Settings</button>
        <button id="clear" class="btn" type="button">Clear</button>
      </div>
    </header>

    <div id="banner" class="banner" role="status" hidden></div>

    <section id="settings" class="settings" aria-label="Chat settings" hidden>
      <div class="settings-grid">
        <label class="field">
          <span>Model</span>
          <input id="setting-model" type="text" autocomplete="off" spellcheck="false" />
        </label>
        <label class="field">
          <span>Max tokens</span>
          <input id="setting-max-tokens" type="number" min="1" step="1" />
        </label>
        <label class="field">
          <span>Temperature</span>
          <input id="setting-temperature" type="number" min="0" max="2" step="0.1" />
        </label>
        <label class="field">
          <span>Top P</span>
          <input id="setting-top-p" type="number" min="0" max="1" step="0.05" />
        </label>
      </div>
      <label class="field">
        <span>System prompt</span>
        <textarea id="setting-system" rows="2"></textarea>
      </label>
      <div class="settings-actions">
        <button id="reset-settings" class="btn btn-quiet" type="button">Reset defaults</button>
        <span class="hint">Saved in this browser only.</span>
      </div>
    </section>

    <section id="messages" class="messages" role="log" aria-live="polite">
      <div class="empty" id="empty">
        <p>Ask a question, or attach an image and ask about it.</p>
      </div>
    </section>

    <form id="composer" class="composer">
      <div id="attachment" class="attachment" hidden>
        <img id="attachment-image" alt="Attached image" />
        <button id="remove-image" class="icon-btn" type="button" title="Remove image" aria-label="Remove image">&times;</button>
      </div>
      <textarea id="draft" rows="2" placeholder="Ask the model. Enter sends, Shift+Enter adds a line."></textarea>
      <div class="composer-actions">
        <input id="file" type="file" accept="image/*" hidden />
        <button id="attach" class="btn" type="button">Attach image</button>
        <span id="status" class="hint" role="status" aria-live="polite"></span>
        <span class="spacer"></span>
        <button id="stop" class="btn" type="button" hidden>Stop</button>
        <button id="send" class="btn btn-primary" type="submit">Send</button>
      </div>
    </form>

    <footer class="app-footer">
      Requests go to <code>/api/chat</code> on this machine. The key stays in <code>.env</code>.
    </footer>
  </main>
  <script src="/app.js"></script>
</body>
</html>
